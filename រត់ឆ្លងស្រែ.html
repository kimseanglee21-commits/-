<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>រត់ឆ្លងស្រែ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Moul&family=Noto+Sans+Khmer:wght@400;600&display=swap">
<style>
  /* Layout: one centered column. Title, live stats, the game stage, touch controls, help line. */
  :root {
    --night: #141c36;
    --panel: #1b2447;
    --line: #34406e;
    --text: #eef0f8;
    --muted: #a8b0cc;
    --glow: #ff9a52;
    --sun: #ffd166;
    --danger: #e5484d;
    --font-display: "Moul", "Khmer OS Muol", serif;
    --font-body: "Noto Sans Khmer", "Khmer OS", "Leelawadee UI", system-ui, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--night);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.8;
    padding-block: 24px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  main { max-width: 880px; margin-inline: auto; display: flex; flex-direction: column; gap: 16px; }
  header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 8px 24px; }
  h1 {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 400;
    font-size: clamp(24px, 6vw, 34px);
    line-height: 1.9;
    color: var(--sun);
    text-wrap: balance;
  }
  .sub { margin: 0; color: var(--muted); max-width: 46ch; min-width: 0; }
  .stats { display: flex; gap: 28px; }
  .stat { display: flex; flex-direction: column; line-height: 1.5; }
  .stat span:first-child { font-size: 13px; color: var(--muted); letter-spacing: 0.04em; }
  .stat span:last-child { font-size: 28px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .stat.best span:last-child { color: var(--glow); }

  .stage { position: relative; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--panel); }
  canvas { display: block; width: 100%; height: auto; aspect-ratio: 8 / 3; touch-action: manipulation; }
  .overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 6px; text-align: center; padding: 16px;
    background: rgba(14, 20, 40, 0.58);
    cursor: pointer;
  }
  .overlay h2 { margin: 0; font-size: clamp(20px, 4.5vw, 28px); font-weight: 600; }
  .overlay p { margin: 0 0 8px; color: var(--muted); max-width: 40ch; font-size: 15px; line-height: 1.7; }
  .overlay p.new { color: var(--sun); }
  .go {
    font: inherit; font-weight: 600; font-size: 17px;
    background: var(--sun); color: #2a2110;
    border: 0; border-radius: 6px; padding: 8px 28px; cursor: pointer;
  }

  .controls { display: flex; gap: 12px; }
  .pad {
    flex: 1; min-width: 0;
    font: inherit; font-weight: 600; font-size: 18px;
    color: var(--text); background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px;
    padding: 14px 12px;
    touch-action: manipulation; user-select: none; -webkit-user-select: none;
    cursor: pointer;
  }
  .pad:active { background: var(--line); }
  .go:focus-visible, .pad:focus-visible { outline: 3px solid var(--glow); outline-offset: 2px; }
  .help { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.8; }
  kbd {
    font-family: var(--font-body); font-size: 13px;
    border: 1px solid var(--line); border-radius: 4px; padding: 1px 7px; background: var(--panel); color: var(--text);
  }
</style>

<main>
  <header>
    <div>
      <h1>រត់ឆ្លងស្រែ</h1>
      <p class="sub">រត់តាមដងស្រែពេលព្រលប់ លោតពីលើថ្ម ឱនគេចសត្វស្លាប ហើយរត់ឱ្យបានឆ្ងាយបំផុត។</p>
    </div>
    <div class="stats" aria-live="off">
      <div class="stat"><span>ចម្ងាយ (ម៉ែត្រ)</span><span id="dist">០</span></div>
      <div class="stat best"><span>ល្អបំផុត</span><span id="best">០</span></div>
    </div>
  </header>

  <div class="stage" id="stage">
    <canvas id="game" aria-label="ហ្គេមរត់"></canvas>
    <div class="overlay" id="overlay" aria-live="polite">
      <h2 id="ovTitle">ត្រៀមខ្លួនរត់</h2>
      <p id="ovText">ចុច Space ឬប៉ះអេក្រង់ដើម្បីលោត។ ចុចព្រួញចុះដើម្បីឱនគេចសត្វស្លាប។</p>
      <button class="go" id="startBtn" type="button">ចាប់ផ្តើមរត់</button>
    </div>
  </div>

  <div class="controls">
    <button class="pad" id="btnJump" type="button">លោត</button>
    <button class="pad" id="btnDuck" type="button">ឱន</button>
  </div>
  <p class="help"><kbd>Space</kbd> ឬ <kbd>↑</kbd> ដើម្បីលោត · <kbd>↓</kbd> ដើម្បីឱន។ សត្វស្លាបហោះទាបត្រូវឱនគេច ថ្មនិងបង្គោលត្រូវលោតរំលង។</p>
</main>

<script>
(function () {
  var W = 800, H = 300, GROUND = 236;
  var cv = document.getElementById('game');
  var ctx = cv.getContext('2d');
  var overlay = document.getElementById('overlay');
  var ovTitle = document.getElementById('ovTitle');
  var ovText = document.getElementById('ovText');
  var startBtn = document.getElementById('startBtn');
  var distEl = document.getElementById('dist');
  var bestEl = document.getElementById('best');
  var scale = 1;

  function kd(n) { return String(n).replace(/\d/g, function (d) { return '០១២៣៤៥៦៧៨៩'.charAt(d); }); }

  var best = 0;
  try { best = parseInt(localStorage.getItem('rot-chlong-sre-best'), 10) || 0; } catch (e) {}

  var mode = 'ready';
  var cam = 0, dist = 0, speed = 0, runT = 0, nextSpawn = 0, overAt = 0, time = 0;
  var obstacles = [];
  var P = { x: 96, y: GROUND, vy: 0, duck: false, air: false };
  var lastM = -1, lastBest = -1;

  // Fixed star field
  var stars = [];
  (function () {
    var s = 7;
    function rnd() { s = (s * 16807) % 2147483647; return s / 2147483647; }
    for (var i = 0; i < 26; i++) stars.push([rnd() * W, rnd() * 100, 0.6 + rnd() * 1.1, rnd() * 6.28]);
  })();

  function resize() {
    var r = cv.getBoundingClientRect();
    if (!r.width) return;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(r.width * dpr);
    cv.height = Math.round(r.width * dpr * H / W);
    scale = cv.width / W;
  }
  if (window.ResizeObserver) new ResizeObserver(resize).observe(cv);
  window.addEventListener('resize', resize);
  resize();

  /* ---------- game flow ---------- */
  function start() {
    mode = 'run';
    cam = 0; dist = 0; speed = 330; obstacles = [];
    nextSpawn = 520;
    P.y = GROUND; P.vy = 0; P.air = false; P.duck = false;
    overlay.hidden = true;
  }
  function tryStart() {
    if (mode === 'run') return;
    if (mode === 'over' && performance.now() - overAt < 450) return;
    start();
  }
  function gameOver() {
    mode = 'over';
    overAt = performance.now();
    P.duck = false;
    var m = Math.floor(dist / 40);
    var isNew = m > best;
    if (isNew) {
      best = m;
      try { localStorage.setItem('rot-chlong-sre-best', String(best)); } catch (e) {}
    }
    ovTitle.textContent = 'ជំពប់ដួលហើយ';
    ovText.textContent = 'អ្នករត់បាន ' + kd(m) + ' ម៉ែត្រ' + (isNew ? ' · កំណត់ត្រាថ្មី!' : '');
    ovText.className = isNew ? 'new' : '';
    startBtn.textContent = 'រត់ម្តងទៀត';
    overlay.hidden = false;
  }
  function jump() {
    if (mode !== 'run') { tryStart(); return; }
    if (!P.air) { P.vy = -780; P.air = true; }
  }
  function setDuck(v) { P.duck = (mode === 'run') ? v : false; }

  function spawn() {
    var m = dist / 40, r = Math.random(), o;
    if (m > 120 && r < 0.3) {
      o = { type: 'bird', w: 36, h: 26, top: 172, ph: Math.random() * 6 };
    } else if (r < 0.62) {
      o = { type: 'post', w: 20, h: 40 + Math.random() * 14 };
    } else {
      o = { type: 'rock', w: 44, h: 26 + Math.random() * 10 };
    }
    o.x = W + 40;
    obstacles.push(o);
    nextSpawn = o.w + speed * 0.8 + 120 + Math.random() * 280;
  }

  function hit() {
    var pw = P.duck ? 38 : 22, ph = P.duck ? 24 : 50;
    var px = P.x - pw / 2, py = P.y - ph - 2;
    for (var i = 0; i < obstacles.length; i++) {
      var o = obstacles[i], ox, oy, ow, oh;
      if (o.type === 'bird') { ox = o.x + 5; ow = o.w - 10; oy = o.top + 4; oh = o.h - 8; }
      else { ox = o.x + 3; ow = o.w - 6; oy = GROUND - o.h + 3; oh = o.h - 3; }
      if (px < ox + ow && px + pw > ox && py < oy + oh && py + ph > oy) return true;
    }
    return false;
  }

  function update(dt) {
    time += dt;
    if (mode === 'run') {
      var m = dist / 40;
      speed = Math.min(330 + m * 1.1, 700);
      dist += speed * dt;
      cam += speed * dt;
      runT += dt * (8 + speed / 60);
      if (P.air) {
        P.vy += (P.duck ? 4200 : 2200) * dt;
        P.y += P.vy * dt;
        if (P.y >= GROUND) { P.y = GROUND; P.vy = 0; P.air = false; }
      }
      nextSpawn -= speed * dt;
      if (nextSpawn <= 0) spawn();
      for (var i = obstacles.length - 1; i >= 0; i--) {
        var o = obstacles[i];
        o.x -= speed * dt;
        if (o.type === 'bird') o.ph += dt * 14;
        if (o.x + o.w < -60) obstacles.splice(i, 1);
      }
      if (hit()) gameOver();
    } else if (mode === 'ready') {
      cam += 60 * dt;
      runT += dt * 9;
    }
  }

  /* ---------- drawing ---------- */
  function hills(off, base, amp, col, f1, f2) {
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.moveTo(0, GROUND);
    for (var x = 0; x <= W; x += 10) {
      var u = x + off;
      ctx.lineTo(x, base + Math.sin(u * f1) * amp + Math.sin(u * f2 + 1.3) * amp * 0.5);
    }
    ctx.lineTo(W, GROUND);
    ctx.closePath();
    ctx.fill();
  }

  // Sugar palms: the silhouette of the Cambodian plain
  var PALMS = [[60, 118, 5], [310, 92, -4], [570, 140, 6]];
  function drawPalm(x, h, lean) {
    if (x < -70 || x > W + 70) return;
    var by = GROUND - 8, tx = x + lean, ty = by - h;
    ctx.strokeStyle = '#1a1f44';
    ctx.lineCap = 'round';
    ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(x, by); ctx.quadraticCurveTo(x + lean * 0.2, by - h * 0.5, tx, ty); ctx.stroke();
    ctx.lineWidth = 3;
    for (var i = 0; i <= 6; i++) {
      var a = -Math.PI + i * (Math.PI / 6);
      var ex = tx + Math.cos(a) * 36, ey = ty + Math.sin(a) * 16 + 15;
      var cx = tx + Math.cos(a) * 19, cy = ty + Math.sin(a) * 30 - 4;
      ctx.beginPath(); ctx.moveTo(tx, ty); ctx.quadraticCurveTo(cx, cy, ex, ey); ctx.stroke();
    }
    ctx.fillStyle = '#1a1f44';
    ctx.beginPath(); ctx.arc(tx, ty + 2, 4.5, 0, 6.28); ctx.fill();
  }
  function palms(off) {
    var T = 780, start = -(off % T);
    for (var t0 = start; t0 < W + T; t0 += T) {
      for (var i = 0; i < PALMS.length; i++) drawPalm(t0 + PALMS[i][0], PALMS[i][1], PALMS[i][2]);
    }
  }

  function drawBackground() {
    var g = ctx.createLinearGradient(0, 0, 0, GROUND);
    g.addColorStop(0, '#141b3c');
    g.addColorStop(0.5, '#43397a');
    g.addColorStop(0.82, '#c4607b');
    g.addColorStop(1, '#ff9a52');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, GROUND + 1);

    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      ctx.globalAlpha = 0.35 + 0.35 * Math.sin(time * 1.5 + s[3]);
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(s[0], s[1], s[2], 0, 6.28); ctx.fill();
    }
    ctx.globalAlpha = 1;

    var sg = ctx.createRadialGradient(560, 176, 10, 560, 176, 150);
    sg.addColorStop(0, 'rgba(255,170,100,0.6)');
    sg.addColorStop(1, 'rgba(255,154,82,0)');
    ctx.fillStyle = sg;
    ctx.fillRect(400, 30, 320, 210);
    ctx.fillStyle = '#ffd08a';
    ctx.beginPath(); ctx.arc(560, 176, 36, 0, 6.28); ctx.fill();

    hills(cam * 0.05, 188, 10, '#4a4486', 0.006, 0.017);
    hills(cam * 0.12, 206, 12, '#2b2f60', 0.009, 0.025);
    palms(cam * 0.3);

    // paddy field
    ctx.fillStyle = '#2f5a43';
    ctx.fillRect(0, GROUND, W, H - GROUND);
    ctx.strokeStyle = '#4a8062';
    ctx.lineWidth = 2;
    for (var r = 0; r < 4; r++) {
      var y = GROUND + 18 + r * 13;
      ctx.setLineDash([14 + r * 4, 24 + r * 8]);
      ctx.lineDashOffset = cam * (1 + r * 0.35);
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }
    ctx.setLineDash([]);
    // earth dyke the runner uses
    ctx.fillStyle = '#8a6a45';
    ctx.fillRect(0, GROUND, W, 9);
    ctx.fillStyle = '#b8935f';
    ctx.fillRect(0, GROUND, W, 3);
  }

  function drawObstacle(o) {
    if (o.type === 'rock') {
      ctx.fillStyle = '#6a7399';
      ctx.beginPath();
      ctx.moveTo(o.x, GROUND);
      ctx.lineTo(o.x + 4, GROUND - o.h * 0.6);
      ctx.lineTo(o.x + o.w * 0.3, GROUND - o.h);
      ctx.lineTo(o.x + o.w * 0.7, GROUND - o.h * 0.85);
      ctx.lineTo(o.x + o.w, GROUND - o.h * 0.35);
      ctx.lineTo(o.x + o.w - 2, GROUND);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#98a3c9'; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(o.x + 4, GROUND - o.h * 0.6);
      ctx.lineTo(o.x + o.w * 0.3, GROUND - o.h);
      ctx.lineTo(o.x + o.w * 0.7, GROUND - o.h * 0.85);
      ctx.stroke();
    } else if (o.type === 'post') {
      ctx.fillStyle = '#a86f3c';
      ctx.fillRect(o.x, GROUND - o.h, o.w, o.h);
      ctx.fillStyle = '#d19457';
      ctx.fillRect(o.x - 2, GROUND - o.h, o.w + 4, 6);
      ctx.strokeStyle = '#6b4424'; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(o.x, GROUND - o.h * 0.55); ctx.lineTo(o.x + o.w, GROUND - o.h * 0.45);
      ctx.moveTo(o.x, GROUND - o.h * 0.35); ctx.lineTo(o.x + o.w, GROUND - o.h * 0.25);
      ctx.stroke();
    } else {
      // white egret in flight
      var cx = o.x + o.w / 2, cy = o.top + o.h / 2, f = Math.sin(o.ph);
      ctx.fillStyle = '#c4cbe6';
      ctx.beginPath();
      ctx.moveTo(cx + 2, cy - 1); ctx.lineTo(cx + 10, cy - f * 12 - 6); ctx.lineTo(cx - 4, cy + 1); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#f5f7ff';
      ctx.beginPath(); ctx.ellipse(cx, cy + 1, 13, 5.5, 0, 0, 6.28); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(cx + 3, cy); ctx.lineTo(cx - 10, cy + f * 13 - 1); ctx.lineTo(cx - 1, cy + 3); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(cx + 12, cy + 1); ctx.lineTo(cx + 20, cy + 4); ctx.lineTo(cx + 11, cy + 4); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#f5f7ff'; ctx.lineWidth = 3; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(cx - 10, cy); ctx.lineTo(cx - 15, cy - 3); ctx.stroke();
      ctx.beginPath(); ctx.arc(cx - 16, cy - 3, 3.6, 0, 6.28); ctx.fillStyle = '#f5f7ff'; ctx.fill();
      ctx.fillStyle = '#ffb84d';
      ctx.beginPath(); ctx.moveTo(cx - 19, cy - 4); ctx.lineTo(cx - 26, cy - 2); ctx.lineTo(cx - 19, cy - 1); ctx.closePath(); ctx.fill();
    }
  }

  function line(x1, y1, x2, y2, w, col) {
    ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  }

  function drawPlayer() {
    var x = P.x, y = P.y;
    var SHIRT = '#ffd166', PANTS = '#f4efe2', SKIN = '#e8b48a', HAIR = '#1b1b2f', KRAMA = '#e5484d';
    // shadow
    var lift = Math.max(0, GROUND - y);
    ctx.fillStyle = 'rgba(0,0,0,0.28)';
    ctx.beginPath(); ctx.ellipse(x, GROUND + 4, Math.max(6, 16 - lift * 0.06), 3, 0, 0, 6.28); ctx.fill();

    var wave = Math.sin(runT * 1.3);
    if (P.duck) {
      line(x - 6, y - 12, x - 26, y - 4, 7, PANTS);
      line(x - 6, y - 12, x - 2, y - 3, 7, PANTS);
      line(x - 6, y - 14, x + 10, y - 21, 13, SHIRT);
      line(x + 8, y - 18, x + 26, y - 14, 5, SKIN);
      // krama
      ctx.fillStyle = KRAMA;
      ctx.beginPath();
      ctx.moveTo(x + 9, y - 27); ctx.lineTo(x - 14, y - 31 + wave * 3); ctx.lineTo(x - 14, y - 26 + wave * 3); ctx.lineTo(x + 9, y - 22); ctx.closePath(); ctx.fill();
      ctx.fillStyle = SKIN;
      ctx.beginPath(); ctx.arc(x + 19, y - 24, 8, 0, 6.28); ctx.fill();
      ctx.fillStyle = HAIR;
      ctx.beginPath(); ctx.arc(x + 19, y - 25, 8, Math.PI * 0.95, Math.PI * 1.95); ctx.fill();
      return;
    }
    var hipY = y - 24;
    var a = P.air;
    var s1 = Math.sin(runT), s2 = Math.sin(runT + Math.PI);
    var f1x = a ? x + 11 : x + s1 * 13, f1y = a ? y - 15 : y - Math.max(0, Math.cos(runT)) * 7;
    var f2x = a ? x - 8 : x + s2 * 13, f2y = a ? y - 7 : y - Math.max(0, Math.cos(runT + Math.PI)) * 7;
    line(x, hipY, f2x, f2y, 7, PANTS);
    line(x, hipY, f1x, f1y, 7, PANTS);
    // far arm
    var shY = y - 41;
    var h1x = a ? x - 10 : x - Math.cos(runT) * 11 + 3, h1y = a ? shY - 8 : shY + 13;
    var h2x = a ? x + 14 : x + Math.cos(runT) * 11 + 3, h2y = a ? shY - 12 : shY + 13;
    line(x, shY, h1x, h1y, 5, SKIN);
    // torso
    ctx.fillStyle = SHIRT;
    ctx.beginPath();
    ctx.moveTo(x - 6, hipY + 1); ctx.lineTo(x + 6, hipY + 1); ctx.lineTo(x + 8, shY - 2); ctx.lineTo(x - 4, shY - 2); ctx.closePath(); ctx.fill();
    line(x, shY, h2x, h2y, 5, SKIN);
    // krama trailing
    ctx.fillStyle = KRAMA;
    ctx.beginPath();
    ctx.moveTo(x - 2, shY - 3);
    ctx.quadraticCurveTo(x - 14, shY - 6 + wave * 4, x - 26, shY - 2 + wave * 6);
    ctx.lineTo(x - 26, shY + 3 + wave * 6);
    ctx.quadraticCurveTo(x - 14, shY + 1 + wave * 4, x - 1, shY + 3);
    ctx.closePath(); ctx.fill();
    // head
    ctx.fillStyle = SKIN;
    ctx.beginPath(); ctx.arc(x + 3, y - 50, 8, 0, 6.28); ctx.fill();
    ctx.fillStyle = HAIR;
    ctx.beginPath(); ctx.arc(x + 3, y - 51, 8, Math.PI * 0.9, Math.PI * 1.95); ctx.fill();
  }

  function draw() {
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    drawBackground();
    for (var i = 0; i < obstacles.length; i++) drawObstacle(obstacles[i]);
    drawPlayer();
  }

  function hud() {
    var m = Math.floor(dist / 40);
    if (m !== lastM) { distEl.textContent = kd(m); lastM = m; }
    var b = Math.max(best, m);
    if (b !== lastBest) { bestEl.textContent = kd(b); lastBest = b; }
  }

  var last = performance.now();
  function frame(now) {
    var dt = Math.min((now - last) / 1000, 0.033);
    last = now;
    update(dt);
    draw();
    hud();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* ---------- input ---------- */
  overlay.addEventListener('click', tryStart);
  cv.addEventListener('pointerdown', function (e) { e.preventDefault(); jump(); });

  var btnJump = document.getElementById('btnJump');
  var btnDuck = document.getElementById('btnDuck');
  btnJump.addEventListener('pointerdown', function (e) { e.preventDefault(); jump(); });
  btnDuck.addEventListener('pointerdown', function (e) { e.preventDefault(); setDuck(true); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(function (ev) {
    btnDuck.addEventListener(ev, function () { setDuck(false); });
  });

  window.addEventListener('keydown', function (e) {
    var k = e.code;
    if (k === 'Space' || k === 'ArrowUp' || k === 'KeyW') {
      e.preventDefault();
      if (!e.repeat) { if (mode === 'run') jump(); else tryStart(); }
    } else if (k === 'ArrowDown' || k === 'KeyS') {
      e.preventDefault();
      setDuck(true);
    }
  });
  window.addEventListener('keyup', function (e) {
    if (e.code === 'ArrowDown' || e.code === 'KeyS') setDuck(false);
  });
  window.addEventListener('blur', function () { setDuck(false); });
})();
</script>
